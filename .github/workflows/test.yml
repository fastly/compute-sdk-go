# Tests the codebase.
name: Test
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go-version:
    uses: ./.github/workflows/go-version.yml

  lint:
    runs-on: ubuntu-latest
    needs: go-version
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.go-version.outputs.latest-version }}

      - name: Download tool dependencies
        run: go mod download -modfile=tools.mod

      - name: vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install -modfile=tools.mod honnef.co/go/tools/cmd/staticcheck
          GOOS=wasip1 GOARCH=wasm staticcheck -tags=fastlyinternaldebug ./...

      - name: nilness
        run: |
          go install -modfile=tools.mod golang.org/x/tools/go/analysis/passes/nilness/cmd/nilness
          GOOS=wasip1 GOARCH=wasm go vet -tags fastlyinternaldebug -vettool $(which nilness) ./...

      - name: ineffassign
        run: |
          go install -modfile=tools.mod github.com/gordonklaus/ineffassign
          GOOS=wasip1 GOARCH=wasm ineffassign ./...

  test:
    runs-on: ubuntu-latest
    needs: go-version
    strategy:
      matrix:
        include:
          # tinygo doesn't support 1.26 yet
          - go-version: '1.25'
            tinygo-version: ${{ needs.go-version.outputs.tinygo-latest-version }}
          - go-version: ${{ needs.go-version.outputs.mod-version }}
            tinygo-version: ${{ needs.go-version.outputs.tinygo-mod-version }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Setup Fastly CLI
        uses: fastly/compute-actions/setup@v11

      - name: Symlink Viceroy to expected location
        run: |
          ln -sv "$(which viceroy)" "${XDG_CONFIG_HOME:-$HOME/.config}/fastly/viceroy"
          fastly version

      - name: Tests - Go
        run: make test-go

      # Test TinyGo once Go tests have passed

      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: ${{ matrix.tinygo-version }}
          binaryen-version: "124"

      - name: Tests - TinyGo
        run: make test-tinygo

      # Ensure code examples compile

      - name: Build examples Go
        run: make build-examples-go

      - name: Build examples TinyGo
        run: make build-examples-tinygo
